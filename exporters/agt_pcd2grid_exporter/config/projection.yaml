resolution: 0.05
projection_mode: local_ground
origin:
  auto: true
  x: 0.0
  y: 0.0
z_filter:
  min: -0.3
  max: 1.5
ground:
  cell_size: 0.5
  percentile: 0.10
  neighbor_radius_cells: 1
  free_tolerance: 0.10
obstacle_height:
  min: 0.12
  max: 1.80
occupied_threshold: 2
free_threshold: 1
free_space_radius_cells: 2
postprocess:
  closing_radius_cells: 1
  min_component_cells: 3
temporal_filter:
  enabled: true
  voxel_size: 0.20
  min_observations: 2
  min_keyframe_span: 2
empty_cell: unknown
