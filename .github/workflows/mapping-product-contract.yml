name: mapping-product-contract
on:
  pull_request:
    paths:
      - 'bringup/agt_mapping_bringup/**'
      - 'benchmarks/agt_map_localization_benchmark/**'
      - '.github/workflows/mapping-product-contract.yml'
  workflow_dispatch:

jobs:
  ros-free-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest PyYAML
      - name: Compile Python product and migrated Study modules
        run: |
          python -m compileall -q bringup/agt_mapping_bringup/agt_mapping_bringup benchmarks/agt_map_localization_benchmark/agt_map_localization_benchmark/study_workflow.py
      - name: Product contract unit tests
        env:
          PYTHONPATH: bringup/agt_mapping_bringup
        run: |
          python -m pytest -q bringup/agt_mapping_bringup/test/test_product_pipeline.py
          bash scripts/run_mapping.sh --capabilities
          bash scripts/run_mapping.sh --help
      - name: Native acceptance boundary
        run: echo "Qt ROS rosbag and field checks require ROS2 Humble host"
